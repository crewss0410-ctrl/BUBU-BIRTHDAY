<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Bubu ❤️</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: black;
  color: white;
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin-top: 80px;
  font-size: 42px;
  color: #ff4da6;
  text-shadow: 0 0 25px #ff4da6;
}

#text {
  margin-top: 40px;
  font-size: 22px;
  width: 80%;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.8;
}

.heart {
  position: absolute;
  color: pink;
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}
</style>

</head>
<body>

<h1>Happy Birthday Bubu ❤️</h1>

<div id="text"></div>

<script>
let message = [
"Hey Bubu...",
"I didn’t want to wish you like everyone else.",
"So I made something just for you 😄",
"",
"You’re not just someone in my life...",
"You’ve become someone really important to me.",
"",
"I don’t always say it...",
"But I truly cherish you.",
"",
"There’s something about you...",
"Something rare, something real.",
"",
"And honestly...",
"I feel lucky that it’s you.",
"",
"Out of everyone in this world...",
"I’m really glad I found you ❤️",
"",
"Stay happy, keep smiling 😊",
"",
"Now stop smiling alone 😄",
"Your real gift is waiting..."
];

let i = 0;
let j = 0;
let speed = 40;

function typeEffect() {
  if (i < message.length) {
    if (j < message[i].length) {
      document.getElementById("text").innerHTML += message[i].charAt(j);
      j++;
      setTimeout(typeEffect, speed);
    } else {
      document.getElementById("text").innerHTML += "<br><br>";
      j = 0;
      i++;
      setTimeout(typeEffect, 700);
    }
  }
}

typeEffect();

// Floating hearts
function createHeart() {
  let heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 12) + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
